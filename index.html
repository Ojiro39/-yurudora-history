<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4df"><title>歴史ドラゴンバトル 11〜15回</title><style>*{box-sizing:border-box}body{margin:0;color:#4b3e50;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:radial-gradient(circle at 12% 10%,#ffe3ed,transparent 45%),radial-gradient(circle at 90% 28%,#d7f4e6,transparent 45%),linear-gradient(#e0f3ff,#fff6e6);min-height:100vh}.wrap{max-width:640px;margin:auto;padding:18px 15px 75px}.hero{text-align:center;margin:26px 0}h1{font-size:clamp(27px,7vw,39px);color:#e98765;line-height:1.25;text-shadow:2px 3px white}h2{font-size:21px}.muted{color:#817887;font-size:13px;line-height:1.7}.card{background:#fffdf7eF;border:3px solid white;border-radius:25px;padding:17px;margin:16px 0;box-shadow:0 7px 0 #e6d6cd,0 13px 24px #99838d22}.btn{width:100%;display:block;border:2px solid white;border-radius:17px;background:linear-gradient(#ffdb9a,#ffb070);color:#5b3d31;padding:14px 12px;margin:10px 0;font-size:16px;font-weight:800;box-shadow:0 4px #dfaa78;cursor:pointer}.btn.secondary{background:#c8ebf6;box-shadow:0 4px #a2cbd8;color:#36596b}.btn.option{background:#fff;box-shadow:0 3px #e4d8d4;text-align:left;border-color:#ebdfe2;font-size:15px;line-height:1.5}.btn.correct{background:#b8edc8}.btn.wrong{background:#ffd2d8}.btn:disabled{cursor:default}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pick{background:#fff;border:3px solid #eadde2;border-radius:20px;padding:8px 4px;cursor:pointer;text-align:center}.pick.active{background:#fff0d7;border-color:#f4b56d}.pick svg{width:100%;height:100px}.pick strong{font-size:13px;display:block}.stage{border:2px solid #eee1df;border-radius:19px;background:white;padding:13px;margin:9px 0;cursor:pointer;text-align:left;width:100%;font-size:15px;color:#55475a}.stage strong{display:block;font-size:17px;margin-bottom:4px}.stage small{color:#8c7d8c}.stage.active{border-color:#f5b572;background:#fff1dc}.stage:disabled{opacity:.6}.hidden{display:none!important}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{display:inline-block;background:#fff9;border:2px solid white;padding:8px 12px;border-radius:40px;font-size:12px}.battle{display:flex;align-items:center;justify-content:space-between;gap:7px}.creature{text-align:center;width:48%;font-size:13px;font-weight:700}.creature svg{height:120px;max-width:100%}.enemy{font-size:84px;height:120px;display:grid;place-items:center;filter:drop-shadow(1px 5px 2px #0002)}.hp{height:10px;background:#eadbdb;border-radius:20px;overflow:hidden;margin:8px 0}.hp i{display:block;height:100%;background:#83d69d;width:100%;transition:width .35s}.enemyhp i{background:#ffa36e}.progress{height:9px;border-radius:30px;background:#e8dfdd;overflow:hidden}.progress i{display:block;background:#8cc7ed;height:100%;transition:width .3s}.feedback{background:#fff2d9;border-radius:15px;padding:13px;line-height:1.7;margin:12px 0}.question{font-size:19px;font-weight:800;line-height:1.55;margin:16px 0}.overlay{position:fixed;inset:0;background:#342b4ba8;z-index:30;display:grid;place-items:center;padding:18px}.modal{background:#fff9ed;border:5px solid #fff;border-radius:27px;text-align:center;padding:24px 18px;max-width:440px;width:100%;box-shadow:0 18px 60px #0004}.modal h2{font-size:28px;color:#dc8061}.modal .big{font-size:95px;line-height:1.5}.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dexitem{background:#fff;border-radius:15px;padding:10px 4px;text-align:center;font-size:12px;min-height:130px}.dexitem .big{font-size:48px}.unknown{font-size:52px;color:#a2a2ac;background:#edeef2;border-radius:15px;padding:5px}.mini{font-size:12px;color:#776b79}.tag{background:#e8f3ff;border-radius:8px;padding:4px 7px;font-size:12px}a{color:#3475a6}button:focus-visible{outline:3px solid #568aca}</style></head><body><div class="wrap"><header class="row"><span <section id="home"><div class="hero"><div style="font-size:49px">🌸🐲🌼</div><h1>ゆるドラ歴史<br>モンスターバトル</h1><p class="muted">江戸時代②〜明治時代①・第15回総合<br>5つのステージを冒険しよう！</p></div><div class="card"><h2>🐣 相棒を選ぼう</h2><div class="grid" id="picks"></div><p class="muted">正解で経験値をためて、姿を進化させよう！</p></div><div class="card"><h2>🗺️ 冒険するステージ</h2><div id="stages"></div><p class="muted">各回50問（第15回は55問）。1回の冒険は10問・20問・全問から選べるよ。</p><div class="row"><button class="btn secondary" style="width:32%" onclick="start(10)">10問</button><button class="btn secondary" style="width:32%" onclick="start(20)">20問</button><button class="btn" style="width:32%" onclick="start(0)">全問</button></div></div><button class="btn secondary" onclick="showDex()">📖 モンスター図鑑</button><button class="btn secondary" onclick="showStudy()">📅 重要年号・資料のまとめ</button><p class="muted">※同じ端末のブラウザに進捗を保存。別端末とは自動同期しません。クイズは予習シリーズの内容に沿ったオリジナル問題です。</p></section>

<script>const banks={"11":[{"q":"享保の改革を進めた将軍は？","a":"徳川吉宗","o":["徳川吉宗","徳川家光","徳川綱吉","徳川慶喜"],"e":"徳川吉宗は8代将軍。"},{"q":"享保の改革が始まった年は？","a":"1716年","o":["1716年","1688年","1787年","1841年"],"e":"1716年から吉宗が改革を進めた。"},{"q":"庶民の意見を聞くため吉宗が設けたものは？","a":"目安箱","o":["目安箱","五人組","寺子屋","評定所"],"e":"目安箱は1721年に設置された。"},{"q":"目安箱が設置された年は？","a":"1721年","o":["1721年","1716年","1742年","1787年"],"e":"1721年の設置。"},{"q":"吉宗が大名に米を納めさせた制度は？","a":"上米の制","o":["上米の制","参勤交代","株仲間","地租改正"],"e":"上米の制は幕府財政の立て直し策。"},{"q":"上米の制と引き換えに緩和されたものは？","a":"参勤交代の江戸滞在期間","o":["参勤交代の江戸滞在期間","鎖国","身分制度","五人組"],"e":"江戸滞在期間を短縮した。"},{"q":"吉宗が裁判の基準として定めた法令は？","a":"公事方御定書","o":["公事方御定書","武家諸法度","五箇条の御誓文","大日本帝国憲法"],"e":"1742年に制定。"},{"q":"公事方御定書が制定された年は？","a":"1742年","o":["1742年","1721年","1774年","1841年"],"e":"公事方御定書は1742年。"},{"q":"吉宗が新田開発を進めた主な目的は？","a":"年貢収入を増やすため","o":["年貢収入を増やすため","外国と貿易するため","武士を減らすため","寺を増やすため"],"e":"新田開発で米の生産を増やした。"},{"q":"商業を重視して株仲間を奨励した人物は？","a":"田沼意次","o":["田沼意次","松平定信","水野忠邦","大塩平八郎"],"e":"田沼意次は商業活動からの収入を重視した。"},{"q":"株仲間とは何？","a":"商人・職人の同業者組合","o":["商人・職人の同業者組合","農民の自治組織","武士の学校","外国船の組織"],"e":"同業者による組合。"},{"q":"田沼意次の政治で重視されたのは？","a":"商業からの税収","o":["商業からの税収","鎖国の強化だけ","廃藩置県","徴兵制"],"e":"株仲間などを利用した。"},{"q":"田沼時代に開発を進めようとした地域は？","a":"蝦夷地","o":["蝦夷地","沖縄","小笠原諸島","台湾"],"e":"蝦夷地の開発を計画した。"},{"q":"寛政の改革を行った老中は？","a":"松平定信","o":["松平定信","田沼意次","徳川吉宗","水野忠邦"],"e":"松平定信が主導。"},{"q":"寛政の改革が始まった年は？","a":"1787年","o":["1787年","1716年","1774年","1841年"],"e":"1787年開始。"},{"q":"寛政の改革で飢饉に備えて米を蓄えさせた政策は？","a":"囲米","o":["囲米","上米の制","人返しの法","地租改正"],"e":"囲米は備蓄策。"},{"q":"寛政の改革で旗本・御家人の借金を整理した法令は？","a":"棄捐令","o":["棄捐令","異国船打払令","廃刀令","武家諸法度"],"e":"棄捐令は借金の帳消しなどを定めた。"},{"q":"寛政異学の禁で重視された学問は？","a":"朱子学","o":["朱子学","蘭学","国学","洋学"],"e":"幕府の学校で朱子学を正統とした。"},{"q":"寛政異学の禁が出された年は？","a":"1790年","o":["1790年","1787年","1825年","1841年"],"e":"1790年。"},{"q":"寛政の改革と関係が深い人物は？","a":"松平定信","o":["松平定信","水野忠邦","板垣退助","伊藤博文"],"e":"松平定信の改革。"},{"q":"天保の改革を行った老中は？","a":"水野忠邦","o":["水野忠邦","松平定信","田沼意次","徳川吉宗"],"e":"水野忠邦が主導。"},{"q":"天保の改革が始まった年は？","a":"1841年 function home(){let completed=JSON.parse(localStorage.getItem('yurudora_complete')||'{}');$('picks').innerHTML=allies.map((a,i)=>'<button class="pick '+(i===chosen?'active':'')+'" onclick="setAlly('+i+')">'+art(i,getLevel())+'<strong>'+a[0]+'</strong><span class="mini">'+a[1]+'</span></button>').join('');$('stages').innerHTML=Object.entries(stages).map(([k,v])=>'<button class="stage '+(stage==k?'active':'')+'" onclick="stage='+k+';home()"><strong>'+(k==15?'👑':'🏯')+' 第'+k+'回　'+v[0]+'</strong><small>'+v[1]+'　'+(completed[k]?'⭐最高 '+completed[k]+'問正解':'未クリア')+'</small></button>').join('');$('best').textContent='⭐ 累計 '+(localStorage.getItem('yurudora_total')||0)+'問';show('home')}

function escapeHTML(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function escapeAttr(s){return escapeHTML(s)}
function answer(a){if(locked)return;locked=true;let q=order[pos],ok=a===q.a;answerLog.push(ok);if(!ok)wrong.push(q);$('options').querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.dataset.answer===q.a)b.classList.add('correct');else if(b.dataset.answer===a)b.classList.add('wrong')});if(ok){xp+=8;enemyHP=Math.max(0,enemyHP-40);localStorage.setItem('yurudora_xp',xp)}else {allyHP=Math.max(0,allyHP-20);let misses=JSON.parse(localStorage.getItem('yurudora_misses')||'{}');let key=stage+':'+q.id;misses[key]=(misses[key]||0)+1;localStorage.setItem('yurudora_misses',JSON.stringify(misses))};$('enemyHp').style.width=enemyHP+'%';$('allyHp').style.width=allyHP+'%';$('allyLv').textContent='Lv.'+getLevel()+' ／ XP '+xp;$('feedback').innerHTML='<strong>'+(ok?'✨ 正解！ こうげき成功！':'💦 おしい！ 正解は「'+escapeHTML(q.a)+'」')+'</strong><br>'+escapeHTML(q.e);$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');if(allyHP<=0){failed=true;$('next').textContent='💀 ゲームオーバー';showEvent('💀 ゲームオーバー','⚔️','HPが0になった！ 最後に倒した敵の次から再挑戦できるよ。','再挑戦する ➜',resumeCheckpoint);return}if(enemyHP<=0){$('next').textContent='🏆 勝利！ 次へ ➜';showEvent('🏆 モンスター撃破！','🎊',foes[enemy%foes.length][0]+' を倒した！ 次の敵が待っている！','つづける ➜',null)}}
function nextQuestion(){if(failed){resumeCheckpoint();return}let defeated=enemyHP<=0;pos++;if(defeated){enemy++;enemyHP=100;checkpoint=pos}if(pos>=order.length){finish();return}render();if(defeated)encounter()}
